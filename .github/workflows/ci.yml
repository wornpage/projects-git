name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Source and Docker checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      NO_COLOR: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Run checks and retain every outcome
        timeout-minutes: 25
        run: ./scripts/ci.ps1
      - name: Retain commit-specific evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/ci/
          retention-days: 30
          if-no-files-found: error
